[project]
name = "nodecraft"
version = "0.1.0"
description = "File tree classification and reorganization pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "ty>=0.0.1",
    "anthropic>=0.40",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["agent", "lib", "scripts", "tests", "cli.py", "orchestrator.py"]
